<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>AI usage</title>
<link rel="stylesheet" href="shared.css">
<style>
/* sizes follow the viewport: --ring drives the ring, its stroke, the big number and the fuse */
:root { --ring: clamp(64px, 24vh, 128px); }

/* one short row; the tab already says "AI usage" */
.ph { height: 32px; gap: 10px; padding: 0 6px 0 14px; }
.ph .btn { height: 24px; padding: 0 9px; gap: 5px; font-size: 12px; }
.upd { color: var(--muted); font-size: 12px; }
.upd time { font-family: Consolas, ui-monospace, monospace; }
.btn .gl { font-size: 13px; line-height: 1; }

.pb {
  flex: 1; min-height: 0; overflow: auto; transition: opacity 0.2s;
  padding: clamp(8px, 2.3vh, 16px) clamp(8px, 1.1vw, 16px);
}
body.busy .pb { opacity: 0.5; }
.waiting { margin: auto; color: var(--muted); }

/* rings and fuses: one column per provider, fr shares set by the script, all able to shrink */
.a-body { display: grid; gap: clamp(8px, 1.7vh, 12px); grid-template-rows: minmax(100%, auto); }
.a-body.empty { display: flex; }
.a-prov {
  display: flex; flex-direction: column; min-width: 0;
  padding: clamp(8px, 2vh, 14px) clamp(10px, 1.1vw, 16px) clamp(8px, 1.7vh, 12px);
}
.prov-h { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prov-name { font-weight: 600; font-size: 13.5px; color: var(--fg-strong); }
.prov-plan { min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-mid {
  flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
  padding: 2px 0 calc(var(--ring) * 0.22 - 10px);
}

/* subgrid rows keep names, rings and fuses level when a name wraps */
.a-meters { display: grid; column-gap: clamp(4px, 0.8vw, 10px); grid-template-rows: repeat(5, auto); }
.a-meter {
  grid-row: span 5; display: grid; grid-template-rows: subgrid; justify-items: center;
  min-width: 0; padding: calc(var(--ring) * 0.06) 3px; border-radius: 6px; cursor: default;
}
.a-meter:hover { background: var(--hover); }
.m-name {
  align-self: end; max-width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 6px;
  text-align: center; font-weight: 600; font-size: 12.5px; line-height: 1.3; color: var(--fg-strong);
}
.ring-box {
  justify-self: stretch; height: var(--ring); display: flex; align-items: center; justify-content: center;
  margin: calc(var(--ring) * 0.09) 0 calc(var(--ring) * 0.11);
}
/* the svg keeps its viewBox, so the stroke scales with the ring */
.ring { position: relative; width: var(--ring); height: var(--ring); }
.ring.sm { width: calc(var(--ring) * 0.77); height: calc(var(--ring) * 0.77); }
.ring svg { display: block; width: 100%; height: 100%; }
.ring circle { fill: none; }
.arc.normal { stroke: var(--accent); } .arc.warn { stroke: var(--warn); } .arc.crit { stroke: var(--fail); }
.trk.normal { stroke: var(--accent-track); } .trk.warn { stroke: var(--warn-track); } .trk.crit { stroke: var(--fail-track); }
.a-meter.passed .ring { opacity: 0.55; }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-n { font-size: calc(var(--ring) * 0.25); font-weight: 600; letter-spacing: -0.5px; color: var(--fg-strong); }
.ring-n small { font-size: 0.55em; font-weight: 600; margin-left: 1px; }
.ring.sm .ring-n { font-size: calc(var(--ring) * 0.185); }
.ring-u { margin-top: calc(var(--ring) * 0.03); font-size: clamp(9.5px, calc(var(--ring) * 0.09), 11px); color: var(--muted); }
.fuse { justify-self: stretch; height: clamp(2px, calc(var(--ring) / 30), 4px); display: flex; gap: 2px; }
.fuse i { background: var(--fuse); border-radius: 2px 0 0 2px; }
.fuse b { flex: 1 1 0; min-width: 3px; background: var(--fuse-track); border-radius: 0 2px 2px 0; }
.fuse-l, .m-sub { justify-self: stretch; text-align: right; font-size: 11.5px; line-height: 1.35; color: var(--muted); }
.fuse-l { margin-top: calc(var(--ring) * 0.045); }
.fuse-l strong { font-weight: 600; color: var(--fg); }
.m-sub { margin-top: 1px; }
.a-slot {
  margin: calc(var(--ring) * 0.11) 2px 0; padding: calc(var(--ring) * 0.07) 8px;
  border: 1px dashed var(--border); border-radius: 6px; text-align: center; font-size: 12px; line-height: 1.35; color: var(--muted);
}
.prov-f { margin-top: auto; padding-top: clamp(6px, 1.4vh, 10px); border-top: 1px solid var(--grid); font-size: 12px; line-height: 1.35; color: var(--muted); }
.prov-f b { font-weight: 600; color: var(--fg); }

/* empty state */
.a-empty {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(4px, 1.1vh, 8px); text-align: center; padding-bottom: calc(var(--ring) * 0.3 - 14px);
}
.ghost {
  width: calc(var(--ring) * 0.56); height: calc(var(--ring) * 0.56); margin-bottom: calc(var(--ring) * 0.05);
  border-radius: 50%; border: 1.5px dashed var(--axis); display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: calc(var(--ring) * 0.14);
}
.e1 { max-width: 100%; font-weight: 600; line-height: 1.3; color: var(--fg); }
.e2 { font-size: 12px; line-height: 1.35; color: var(--muted); max-width: min(300px, 100%); }
.e-btns { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1.1vh, 8px); margin-top: clamp(2px, 0.9vh, 6px); }
.e-btns .btn { height: clamp(24px, 4vh, 28px); }
/* the glyph is decoration; below 300 px of height the message and buttons need its room */
@media (max-height: 300px) { .ghost { display: none; } }

.tip { position: fixed; z-index: 10; pointer-events: none; max-width: 300px; padding: 7px 10px; border-radius: 5px; background: var(--tip-bg); color: var(--tip-muted); font-size: 12px; line-height: 1.5; }
.tip .t1 { color: var(--tip-fg); font-weight: 600; }
</style>
</head>
<body data-page="usage">
<header class="ph">
  <span class="upd" id="upd" hidden>Updated <time id="upd-time"></time></span>
  <span class="grow"></span>
  <button class="btn" id="refresh" type="button"><span class="gl" aria-hidden="true">&#8635;</span>Refresh</button>
</header>
<main class="pb a-body empty" id="board"><p class="waiting">Waiting for the first read</p></main>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="bridge.js"></script>
<script>
(function () {
  'use strict';

  const SVGNS = 'http://www.w3.org/2000/svg';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const NBSP = ' ';

  const board = document.getElementById('board');
  const refreshBtn = document.getElementById('refresh');
  const upd = document.getElementById('upd');
  const updTime = document.getElementById('upd-time');
  const tip = document.getElementById('tip');

  let snap = null;
  let busy = false;
  let clocks = [];
  const staleSent = new Set();
  let lastStaleAt = 0;

  // dom helpers; every data string goes through textContent
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
    return n;
  }

  // time formatting
  const pad = n => String(n).padStart(2, '0');
  function clock(d, sep) {
    const h = d.getHours();
    return (h % 12 || 12) + ':' + pad(d.getMinutes()) + (sep || ' ') + (h < 12 ? 'AM' : 'PM');
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function when(d, now) {
    return (sameDay(d, now) ? '' : DAYS[d.getDay()] + ' ') + clock(d, NBSP);
  }
  function span(ms) {
    const total = Math.max(1, Math.ceil(ms / 60000));
    const d = Math.floor(total / 1440), h = Math.floor((total % 1440) / 60), m = total % 60;
    if (d > 0) return d + NBSP + 'd' + NBSP + h + NBSP + 'h';
    if (h > 0) return h + NBSP + 'h' + NBSP + m + NBSP + 'm';
    return m + NBSP + 'm';
  }
  function tzName(d) {
    try {
      const part = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(d)
        .find(p => p.type === 'timeZoneName');
      return part ? ' ' + part.value : '';
    } catch (e) { return ''; }
  }
  function absolute(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + clock(d) + tzName(d);
  }

  // meter helpers
  const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const pct = v => String(+v.toFixed(2));
  const near = (min, target) => Math.abs(min - target) <= target * 0.05;
  function sevClass(s) {
    s = String(s || '').toLowerCase();
    return s === 'warning' ? 'warn' : s === 'critical' ? 'crit' : 'normal';
  }
  function windowLabel(min) {
    if (!(min > 0)) return 'window length unknown';
    if (near(min, 300)) return '5-hour window';
    if (near(min, 1440)) return '1-day window';
    if (near(min, 10080)) return '7-day window';
    if (min % 1440 === 0) return min / 1440 + '-day window';
    if (min % 60 === 0) return min / 60 + '-hour window';
    return min + '-minute window';
  }

  // ring shows the remaining share, starting at 12 o'clock
  function ring(used, size, sev) {
    const sw = size >= 110 ? 8 : 7, c = size / 2, r = (size - sw) / 2, C = 2 * Math.PI * r;
    const left = clamp(100 - used, 0, 100);
    const wrap = el('div', 'ring' + (size < 110 ? ' sm' : ''));
    const svg = svgEl('svg', { width: size, height: size, viewBox: '0 0 ' + size + ' ' + size, 'aria-hidden': 'true' });
    svg.appendChild(svgEl('circle', { class: 'trk ' + sev, cx: c, cy: c, r: r, 'stroke-width': sw }));
    if (left > 0) {
      // round caps add half a stroke at each end, so trim the dash to keep the visible arc true
      const dash = Math.max(0.01, left / 100 * C - sw);
      svg.appendChild(svgEl('circle', {
        class: 'arc ' + sev, cx: c, cy: c, r: r, 'stroke-width': sw, 'stroke-linecap': 'round',
        'stroke-dasharray': dash.toFixed(2) + ' ' + C.toFixed(2), 'stroke-dashoffset': -sw / 2,
        transform: 'rotate(-90 ' + c + ' ' + c + ')'
      }));
    }
    const center = el('div', 'ring-c');
    const n = el('span', 'ring-n', String(Math.round(left)));
    n.appendChild(el('small', null, '%'));
    center.append(n, el('span', 'ring-u', 'left'));
    wrap.append(svg, center);
    return wrap;
  }

  function meter(provider, m, large) {
    const used = num(m.usedPercent), sev = sevClass(m.severity);
    const box = el('div', 'a-meter');
    box.tabIndex = 0;

    const name = el('div', 'm-name');
    name.append(el('span', null, m.name || m.key || 'Meter'),
      el('span', 'chip' + (sev === 'normal' ? '' : ' ' + sev), String(m.severity || 'normal')));
    const ringBox = el('div', 'ring-box');
    ringBox.appendChild(ring(used, large ? 120 : 92, sev));
    const fuse = el('div', 'fuse');
    const fill = el('i');
    fuse.append(fill, el('b'));
    const label = el('div', 'fuse-l');
    box.append(name, ringBox, fuse, label);
    if (m.note) box.appendChild(el('div', 'm-sub', m.note));

    const reset = new Date(m.resetsAt);
    const tipLines = [
      pct(used) + '% used · ' + pct(clamp(100 - used, 0, 100)) + '% left',
      isNaN(reset) ? 'Reset time unknown' : 'Resets ' + absolute(reset),
      windowLabel(num(m.windowMinutes))
    ];
    box.tipLines = tipLines;
    box.setAttribute('aria-label', provider + ' ' + (m.name || '') + ', ' + (m.severity || 'normal') + ': ' + tipLines.join('. '));

    clocks.push({ m, box, fill, label, id: provider + '|' + (m.key || m.name) });
    return box;
  }

  function emptyState(p) {
    const wrap = el('div', 'a-empty');
    const ghost = el('div', 'ghost', '–');
    ghost.setAttribute('aria-hidden', 'true');
    wrap.append(ghost, el('p', 'e1', p.message || 'No usage reported.'));
    if (p.detail) wrap.appendChild(el('p', 'e2', p.detail));
    const actions = Array.isArray(p.actions) ? p.actions : [];
    if (actions.length) {
      const btns = el('div', 'e-btns');
      actions.forEach(a => {
        if (!a || typeof a.id !== 'string') return;
        const b = el('button', 'btn', a.label || a.id);
        b.type = 'button';
        b.addEventListener('click', () => Bridge.send({ type: 'action', id: a.id }));
        btns.appendChild(b);
      });
      wrap.appendChild(btns);
    }
    return wrap;
  }

  function footnote(text) {
    const f = el('footer', 'prov-f');
    const cut = text.indexOf(' · ');
    if (cut > 0) f.append(el('b', null, text.slice(0, cut)), document.createTextNode(text.slice(cut)));
    else f.textContent = text;
    return f;
  }

  function provider(p, meters) {
    const card = el('section', 'card a-prov');
    const name = p.provider || 'Provider';
    card.setAttribute('aria-label', name);
    const head = el('header', 'prov-h');
    head.appendChild(el('span', 'prov-name', name));
    if (p.plan) head.appendChild(el('span', 'prov-plan', p.plan));
    card.appendChild(head);

    if (p.state === 'unavailable' || !meters.length) {
      card.appendChild(emptyState(p.state === 'unavailable' ? p : { message: 'No usage windows reported.' }));
    } else {
      const mid = el('div', 'a-mid');
      const grid = el('div', 'a-meters');
      grid.style.gridTemplateColumns = 'repeat(' + meters.length + ', minmax(0, 1fr))';
      // the 5-hour meter gets the big ring; a lone meter always does
      let big = meters.findIndex(m => near(num(m.windowMinutes), 300));
      if (big < 0) big = 0;
      meters.forEach((m, i) => grid.appendChild(meter(name, m, meters.length === 1 || i === big)));
      mid.appendChild(grid);
      if (!meters.some(m => near(num(m.windowMinutes), 300))) {
        mid.appendChild(el('div', 'a-slot', 'No 5-hour window reported'));
      }
      card.appendChild(mid);
    }
    if (p.footnote) card.appendChild(footnote(String(p.footnote)));
    return card;
  }

  function render() {
    hideTip();
    clocks = [];
    board.textContent = '';
    const providers = snap && Array.isArray(snap.providers) ? snap.providers.filter(p => p && typeof p === 'object') : [];
    if (!providers.length) {
      board.className = 'pb a-body empty';
      board.style.gridTemplateColumns = '';
      board.appendChild(el('p', 'waiting', snap ? 'No providers reported' : 'Waiting for the first read'));
    } else {
      board.className = 'pb a-body';
      const cols = [];
      providers.forEach(p => {
        const meters = p.state === 'unavailable' || !Array.isArray(p.meters)
          ? [] : p.meters.filter(m => m && typeof m === 'object');
        const n = meters.length;
        cols.push('minmax(0, ' + Math.max(1.1, n) + 'fr)');
        board.appendChild(provider(p, meters));
      });
      board.style.gridTemplateColumns = cols.join(' ');
    }
    const at = snap ? new Date(snap.updatedAt) : null;
    upd.hidden = !at || isNaN(at);
    if (!upd.hidden) updTime.textContent = clock(at);
    tick();
  }

  // re-derive countdowns and fuses from resetsAt and the clock
  function tick() {
    const nowMs = Date.now(), now = new Date(nowMs);
    const passed = [];
    clocks.forEach(k => {
      const t = Date.parse(k.m.resetsAt), win = num(k.m.windowMinutes) * 60000;
      k.label.textContent = '';
      if (isNaN(t)) {
        k.fill.style.width = '0%';
        k.label.textContent = 'reset time unknown';
        return;
      }
      const rem = t - nowMs;
      const frac = win > 0 ? clamp(1 - rem / win, 0, 1) : 1;
      k.fill.style.width = (frac * 100).toFixed(1) + '%';
      if (rem <= 0) {
        k.box.classList.add('passed');
        k.label.textContent = 'reset at ' + when(new Date(t), now) + ' · waiting for refresh';
        passed.push(k.id);
      } else {
        k.box.classList.remove('passed');
        k.label.append('resets in ', el('strong', null, span(rem)), ' · ' + when(new Date(t), now));
      }
    });
    reportStale(passed, nowMs);
  }

  // once per meter per snapshot; one message covers every meter that passed together.
  // the 60 s floor stops a loop if the host answers with the same cached numbers
  function reportStale(ids, nowMs) {
    const stamp = snap ? String(snap.updatedAt) : '';
    const fresh = ids.map(id => stamp + '|' + id).filter(k => !staleSent.has(k));
    if (!fresh.length || nowMs - lastStaleAt < 60000) return;
    fresh.forEach(k => staleSent.add(k));
    lastStaleAt = nowMs;
    Bridge.send({ type: 'stale' });
  }

  function setBusy(on) {
    busy = on;
    refreshBtn.disabled = on;
    document.body.classList.toggle('busy', on);
  }

  // tooltip: hover and keyboard focus show the same text
  let cur = null;
  function fillTip(box) {
    tip.textContent = '';
    box.tipLines.forEach((line, i) => tip.appendChild(el('div', i ? null : 't1', line)));
    tip.hidden = false;
  }
  function placeTip(x, y) {
    const w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    let left = x + 14, top = y + 16;
    if (left + w > vw - 8) left = Math.max(8, x - w - 14);
    if (top + h > vh - 8) top = Math.max(8, y - h - 12);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; cur = null; }
  document.addEventListener('mouseover', e => {
    const box = e.target.closest('.a-meter');
    if (box === cur) return;
    cur = box;
    if (!box || !box.tipLines) { tip.hidden = true; return; }
    fillTip(box);
    placeTip(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', e => { if (cur) placeTip(e.clientX, e.clientY); });
  document.addEventListener('focusin', e => {
    const box = e.target.closest && e.target.closest('.a-meter');
    if (!box || !box.tipLines) return;
    const r = box.getBoundingClientRect();
    fillTip(box);
    placeTip(r.left + Math.min(r.width / 2, 120), r.bottom - 8);
  });
  document.addEventListener('focusout', e => {
    if (e.target.closest && e.target.closest('.a-meter')) hideTip();
  });
  board.addEventListener('scroll', hideTip, { passive: true });

  refreshBtn.addEventListener('click', () => { if (!busy) Bridge.send({ type: 'refresh' }); });

  Bridge.on(msg => {
    if (msg.type !== 'snapshot') return;
    if (msg.snapshot && typeof msg.snapshot === 'object') {
      snap = msg.snapshot;
      render();
    }
    setBusy(msg.busy === true);
  });

  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  Bridge.send({ type: 'ready' });
})();
</script>
</body>
</html>
