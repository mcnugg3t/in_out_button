<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>AI usage</title>
<link rel="stylesheet" href="shared.css">
<style>
/* one short row; the tab already says "AI usage" */
.ph { height: 32px; gap: 10px; padding: 0 6px 0 14px; }
.ph .btn { height: 24px; padding: 0 9px; gap: 5px; font-size: 12px; }
.upd { color: var(--muted); font-size: 12px; }
.upd time { font-family: Consolas, ui-monospace, monospace; }
.btn .gl { font-size: 13px; line-height: 1; }

.pb { flex: 1; min-height: 0; overflow: auto; transition: opacity 0.2s; padding: 12px 16px 16px; }
body.busy .pb { opacity: 0.5; }
.waiting { margin: auto; color: var(--muted); }

/* burn pace: a caption row per provider, then its tiles three to a row. the board scrolls, it never shrinks */
.c-body { display: grid; grid-template-columns: repeat(3, minmax(230px, 1fr)); align-content: start; column-gap: 12px; row-gap: 10px; }
.c-body.empty { display: flex; }
.c-cap { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; min-width: 0; padding: 0 2px; }
.c-cap:not(:first-child) { margin-top: 8px; }
.c-cap-r { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prov-name { flex: none; font-weight: 600; font-size: 13.5px; color: var(--fg-strong); }
.prov-plan { min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-foot { flex: none; max-width: 60%; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.c-foot b { font-weight: 600; color: var(--fg); }
.c-stale { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--warn-ink); }
.c-stale-b { display: flex; gap: 6px; }
.c-stale .btn { height: 24px; padding: 0 9px; font-size: 12px; }

.c-tile { min-width: 0; padding: 11px 14px 6px; display: flex; flex-direction: column; }
.c-tile.tm { cursor: default; }
.c-tile.tm:hover { border-color: var(--axis); }
/* a long window note wraps under the name rather than cutting it */
.c-top { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.m-name { min-width: 0; font-weight: 600; font-size: 12.5px; line-height: 18px; color: var(--fg-strong); }
.c-ghost-t .m-name { color: var(--muted); }
.c-win { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.c-nums { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 26px; margin-top: 4px; }
.c-nums > div { display: flex; align-items: baseline; gap: 5px; }
.c-nums b { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.3px; color: var(--fg-strong); }
.c-nums span { font-size: 12px; color: var(--muted); }
.c-tile.stale .c-nums b { color: var(--muted); }

/* chart: x is time through the window, y is percent used; the dotted line is even burn */
.c-chart { margin-top: auto; padding-top: 4px; overflow: hidden; }
.c-chart svg { display: block; }
.cg { stroke: var(--grid); }
.cax { stroke: var(--axis); }
.cguide { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 0.1 4; stroke-linecap: round; fill: none; }
.carea { stroke: none; }
.carea.normal { fill: var(--accent-wash); } .carea.warn { fill: var(--warn-wash); } .carea.crit { fill: var(--fail-wash); }
.cline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cline.normal { stroke: var(--accent); } .cline.warn { stroke: var(--warn); } .cline.crit { stroke: var(--fail); }
/* inferred stretches (origin to the first reading, the flat tail) are dashed; readings joined are solid */
.cline.dash { stroke-dasharray: 5 4; stroke-linecap: butt; }
.cdot { stroke: var(--card); stroke-width: 2; }
.cdot.normal { fill: var(--accent); } .cdot.warn { fill: var(--warn); } .cdot.crit { fill: var(--fail); }
.c-tile.stale .carea { fill: var(--muted-wash); }
.c-tile.stale .cline { stroke: var(--fuse); }
.c-tile.stale .cdot { fill: var(--fuse); }
.c-tile.passed .c-chart { opacity: 0.55; }
.clab { fill: var(--muted); font-size: 11px; }
.c-ghost { position: relative; margin-top: auto; }
.c-ghost p { position: absolute; inset: 0 0 14px; display: flex; align-items: center; justify-content: center; padding: 0 18px; text-align: center; font-size: 12px; line-height: 1.4; color: var(--muted); }

/* unavailable provider: one card across the row */
.c-off { grid-column: 1 / -1; display: flex; min-height: 132px; padding: 14px 16px; }
.c-empty { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.ghost {
  width: 34px; height: 34px; margin-bottom: 2px; border-radius: 50%; border: 1.5px dashed var(--axis);
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px;
}
.e1 { max-width: 100%; font-weight: 600; line-height: 1.3; color: var(--fg); }
.e2 { font-size: 12px; line-height: 1.35; color: var(--muted); max-width: min(520px, 100%); }
.e-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }

.tip { position: fixed; z-index: 10; pointer-events: none; max-width: 300px; padding: 7px 10px; border-radius: 5px; background: var(--tip-bg); color: var(--tip-muted); font-size: 12px; line-height: 1.5; }
.tip .t1 { color: var(--tip-fg); font-weight: 600; }
</style>
</head>
<body data-page="usage">
<header class="ph">
  <span class="upd" id="upd" hidden>Updated <time id="upd-time"></time></span>
  <span class="grow"></span>
  <button class="btn" id="refresh" type="button"><span class="gl" aria-hidden="true">&#8635;</span>Refresh</button>
</header>
<main class="pb c-body empty" id="board"><p class="waiting">Waiting for the first read</p></main>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="bridge.js"></script>
<script>
(function () {
  'use strict';

  const SVGNS = 'http://www.w3.org/2000/svg';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const NBSP = ' ';
  // chart box from candidate C: plot from X0 to the reset edge, labels below it and right of it
  const CH = 106, X0 = 8, RIGHT = 42, TOP = 8, BASE = 86;

  const board = document.getElementById('board');
  const refreshBtn = document.getElementById('refresh');
  const upd = document.getElementById('upd');
  const updTime = document.getElementById('upd-time');
  const tip = document.getElementById('tip');

  let snap = null;
  let busy = false;
  let clocks = [];
  let ghosts = [];
  let ages = [];
  let finished = [];
  const staleSent = new Set();
  let lastStaleAt = 0;

  // dom helpers; every data string goes through textContent
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
    return n;
  }

  // time formatting
  const pad = n => String(n).padStart(2, '0');
  function clock(d, sep) {
    const h = d.getHours();
    return (h % 12 || 12) + ':' + pad(d.getMinutes()) + (sep || ' ') + (h < 12 ? 'AM' : 'PM');
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function when(d, now) {
    return (sameDay(d, now) ? '' : DAYS[d.getDay()] + ' ') + clock(d, NBSP);
  }
  // countdowns round up so they never read 0; ages round down
  function span(ms, down) {
    const total = Math.max(1, down ? Math.floor(ms / 60000) : Math.ceil(ms / 60000));
    const d = Math.floor(total / 1440), h = Math.floor((total % 1440) / 60), m = total % 60;
    if (d > 0) return d + NBSP + 'd' + NBSP + h + NBSP + 'h';
    if (h > 0) return h + NBSP + 'h' + NBSP + m + NBSP + 'm';
    return m + NBSP + 'm';
  }

  // meter helpers
  const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const pct = v => String(+v.toFixed(2));
  const near = (min, target) => Math.abs(min - target) <= target * 0.05;
  function sevClass(s) {
    s = String(s || '').toLowerCase();
    return s === 'warning' ? 'warn' : s === 'critical' ? 'crit' : 'normal';
  }
  function windowLabel(min) {
    if (!(min > 0)) return 'window length unknown';
    if (near(min, 300)) return '5-hour window';
    if (near(min, 1440)) return '1-day window';
    if (near(min, 10080)) return '7-day window';
    if (min % 1440 === 0) return min / 1440 + '-day window';
    if (min % 60 === 0) return min / 60 + '-hour window';
    return min + '-minute window';
  }

  // valid points sorted oldest first, whatever order the host sent; a null or missing
  // history is no history. with fx in burn() clamping every x to 0..1, a point the host
  // should not have sent cannot draw outside the plot box or run backwards
  function history(m) {
    if (!Array.isArray(m.history)) return [];
    return m.history
      .map(h => (h && typeof h === 'object' ? { at: Date.parse(h.at), used: h.usedPercent } : null))
      .filter(h => h && !isNaN(h.at) && typeof h.used === 'number' && isFinite(h.used))
      .sort((a, b) => a.at - b.at);
  }

  // the burn as [elapsed share, percent used] pairs. a window starts at zero, so the path
  // starts at the origin; it runs flat from the last point to the end, which is now for a
  // live provider and the reading's time for a stale one. obs is the index of the last
  // observed point; points 1..obs are readings, the origin and the tail are inferred
  function burn(k, nowMs) {
    const t = Date.parse(k.m.resetsAt), win = num(k.m.windowMinutes) * 60000;
    if (isNaN(t) || !(win > 0)) return null;
    const fx = at => clamp(1 - (t - at) / win, 0, 1);
    const used = clamp(num(k.m.usedPercent), 0, 100);
    const pts = [[0, 0]];
    let end = k.stale ? k.readAt : nowMs;
    if (!k.hist.length) {
      if (isNaN(end)) end = nowMs;
      pts.push([fx(end), used]);
      return { pts, obs: 0, elapsed: fx(end) };
    }
    k.hist.forEach(h => pts.push([fx(h.at), clamp(h.used, 0, 100)]));
    let last = k.hist[k.hist.length - 1];
    // the last point should be the current reading; if it is not, the reading joins at its time
    if (Math.abs(clamp(last.used, 0, 100) - used) > 0.01 && k.readAt > last.at) {
      last = { at: k.readAt, used };
      pts.push([fx(last.at), used]);
    }
    const obs = pts.length - 1;
    if (isNaN(end)) end = last.at;
    if (end > last.at) pts.push([fx(end), clamp(last.used, 0, 100)]);
    return { pts, obs, elapsed: fx(Math.max(end, last.at)) };
  }

  function line(cls, x1, y1, x2, y2) {
    return svgEl('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 });
  }
  function label(text, attrs) {
    const n = svgEl('text', Object.assign({ class: 'clab' }, attrs));
    n.textContent = text;
    return n;
  }
  // the chart is drawn at the host's width so its text never scales
  function frame(host, ghost) {
    const w = Math.max(180, Math.floor(host.clientWidth || 318));
    const x1 = w - RIGHT, mid = (TOP + BASE) / 2;
    const svg = svgEl('svg', { width: w, height: CH, viewBox: '0 0 ' + w + ' ' + CH, 'aria-hidden': 'true' });
    svg.append(line('cg', X0, TOP, x1, TOP), line('cg', X0, mid, x1, mid), line('cg', x1, TOP, x1, BASE),
      line(ghost ? 'cg' : 'cax', X0, BASE, x1, BASE));
    return { svg, x1 };
  }

  function drawChart(k, nowMs) {
    const f = frame(k.chart), x1 = f.x1;
    f.svg.appendChild(line('cguide', X0, BASE, x1, TOP));
    if (k.guide) {
      const gx = (X0 + 0.78 * (x1 - X0)).toFixed(1), gy = (BASE - 0.78 * (BASE - TOP) - 6).toFixed(1);
      const ang = (-Math.atan((BASE - TOP) / (x1 - X0)) * 180 / Math.PI).toFixed(1);
      f.svg.appendChild(label('even pace', { x: gx, y: gy, 'text-anchor': 'middle', transform: 'rotate(' + ang + ' ' + gx + ' ' + gy + ')' }));
    }
    const b = burn(k, nowMs);
    if (b) {
      const xy = p => [+(X0 + p[0] * (x1 - X0)).toFixed(1), +(BASE - p[1] / 100 * (BASE - TOP)).toFixed(1)];
      const pts = b.pts.map(xy), n = pts.length - 1, end = pts[n];
      const d = (from, to) => 'M' + pts.slice(from, to + 1).map(p => p[0] + ' ' + p[1]).join(' L');
      const stroke = (from, to, dash) => svgEl('path', { class: 'cline ' + k.sev + (dash ? ' dash' : ''), d: d(from, to) });
      f.svg.appendChild(svgEl('path', { class: 'carea ' + k.sev, d: d(0, n) + ' L' + end[0] + ' ' + BASE + ' Z' }));
      if (!b.obs) f.svg.appendChild(stroke(0, n, true));
      else {
        f.svg.appendChild(stroke(0, 1, true));
        if (b.obs > 1) f.svg.appendChild(stroke(1, b.obs, false));
        if (n > b.obs) f.svg.appendChild(stroke(b.obs, n, true));
      }
      f.svg.appendChild(svgEl('circle', { class: 'cdot ' + k.sev, cx: end[0], cy: end[1], r: 5 }));
      const text = k.stale ? 'last read' : 'now', half = k.stale ? 23 : 11;
      f.svg.append(label(text, { x: clamp(end[0], half + 1, x1 - half), y: BASE + 15, 'text-anchor': 'middle' }),
        label('reset', { x: x1 + 6, y: BASE + 4 }));
    }
    k.chart.textContent = '';
    k.chart.appendChild(f.svg);
  }

  function drawGhost(host) {
    host.textContent = '';
    host.appendChild(frame(host, true).svg);
  }

  function actionButtons(p, cls) {
    const actions = Array.isArray(p.actions) ? p.actions.filter(a => a && typeof a.id === 'string') : [];
    if (!actions.length) return null;
    const btns = el('div', cls);
    actions.forEach(a => {
      const b = el('button', 'btn', a.label || a.id);
      b.type = 'button';
      b.addEventListener('click', () => Bridge.send({ type: 'action', id: a.id }));
      btns.appendChild(b);
    });
    return btns;
  }

  function emptyState(p) {
    const wrap = el('div', 'c-empty');
    const ghost = el('div', 'ghost', '–');
    ghost.setAttribute('aria-hidden', 'true');
    wrap.append(ghost, el('p', 'e1', p.message || 'No usage reported.'));
    if (p.detail) wrap.appendChild(el('p', 'e2', p.detail));
    const btns = actionButtons(p, 'e-btns');
    if (btns) wrap.appendChild(btns);
    return wrap;
  }

  function footnote(text) {
    const f = el('span', 'c-foot');
    f.title = text;
    const cut = text.indexOf(' · ');
    if (cut > 0) f.append(el('b', null, text.slice(0, cut)), document.createTextNode(text.slice(cut)));
    else f.textContent = text;
    return f;
  }

  function caption(p) {
    const cap = el('header', 'c-cap');
    const row = el('div', 'c-cap-r');
    row.appendChild(el('span', 'prov-name', p.provider || 'Provider'));
    if (p.plan) row.appendChild(el('span', 'prov-plan', String(p.plan)));
    if (p.footnote) row.appendChild(footnote(String(p.footnote)));
    cap.appendChild(row);
    if (p.state === 'stale') {
      const stale = el('div', 'c-stale');
      const text = el('span');
      if (p.detail) text.title = String(p.detail);
      stale.append(el('span', 'chip warn', 'stale'), text);
      const btns = actionButtons(p, 'c-stale-b');
      if (btns) stale.appendChild(btns);
      cap.appendChild(stale);
      ages.push({ node: text, at: Date.parse(p.updatedAt), message: p.message ? String(p.message) : '' });
    }
    return cap;
  }

  function meterTile(p, m, first) {
    const sev = sevClass(m.severity), stale = p.state === 'stale';
    const box = el('div', 'card c-tile tm' + (stale ? ' stale' : ''));
    box.tabIndex = 0;

    const top = el('div', 'c-top');
    top.append(el('span', 'm-name', m.name || m.key || 'Meter'),
      el('span', 'chip' + (sev === 'normal' ? '' : ' ' + sev), String(m.severity || 'normal')),
      el('span', 'c-win', m.note ? String(m.note) : windowLabel(num(m.windowMinutes))));
    const nums = el('div', 'c-nums');
    const left = el('div');
    const leftWord = el('span', null, 'left');
    left.append(el('b', null, Math.round(clamp(100 - num(m.usedPercent), 0, 100)) + '%'), leftWord);
    const countdown = el('div');
    nums.append(left, countdown);
    const chart = el('div', 'c-chart');
    box.append(top, nums, chart);

    const name = p.provider || 'Provider';
    clocks.push({
      p, m, box, leftWord, countdown, chart, sev, stale, guide: first, hist: history(m),
      readAt: Date.parse(p.updatedAt), live: p.state === 'ok', label: name + ' ' + (m.name || ''),
      who: name + ' ' + (m.name || '') + ', ' + (m.severity || 'normal') + (stale ? ', stale reading' : ''),
      id: name + '|' + (m.key || m.name)
    });
    return box;
  }

  function ghostTile() {
    const box = el('div', 'card c-tile c-ghost-t');
    const top = el('div', 'c-top');
    top.append(el('span', 'm-name', '5-hour'), el('span', 'c-win', '5-hour window'));
    const wrap = el('div', 'c-ghost');
    const chart = el('div', 'c-chart');
    wrap.append(chart, el('p', null, 'No 5-hour window reported'));
    box.append(top, wrap);
    ghosts.push(chart);
    return box;
  }

  // a stale meter past its reset is a finished window: its percent, chip, pace and path
  // describe a window that no longer exists, so only its name and length stay
  function finishedTile(k) {
    const box = el('div', 'card c-tile c-ghost-t tm stale');
    box.tabIndex = 0;
    const win = windowLabel(num(k.m.windowMinutes));
    const top = el('div', 'c-top');
    top.append(el('span', 'm-name', k.m.name || k.m.key || 'Meter'), el('span', 'c-win', win));
    const wrap = el('div', 'c-ghost');
    const chart = el('div', 'c-chart');
    const text = el('p');
    wrap.append(chart, text);
    box.append(top, wrap);
    ghosts.push(chart);
    finished.push({ box, text, win, label: k.label, t: Date.parse(k.m.resetsAt) });
    return box;
  }

  function provider(p) {
    board.appendChild(caption(p));
    const meters = p.state === 'unavailable' || !Array.isArray(p.meters)
      ? [] : p.meters.filter(m => m && typeof m === 'object');
    if (!meters.length) {
      const card = el('section', 'card c-off');
      card.setAttribute('aria-label', p.provider || 'Provider');
      card.appendChild(emptyState(p.state === 'unavailable' ? p : { message: 'No usage windows reported.' }));
      board.appendChild(card);
      return;
    }
    meters.forEach((m, i) => board.appendChild(meterTile(p, m, i === 0)));
    const has = target => meters.some(m => near(num(m.windowMinutes), target));
    if (has(10080) && !has(300)) board.appendChild(ghostTile());
  }

  function render() {
    hideTip();
    clocks = [];
    ghosts = [];
    ages = [];
    finished = [];
    board.textContent = '';
    const providers = snap && Array.isArray(snap.providers) ? snap.providers.filter(p => p && typeof p === 'object') : [];
    if (!providers.length) {
      board.className = 'pb c-body empty';
      board.appendChild(el('p', 'waiting', snap ? 'No providers reported' : 'Waiting for the first read'));
    } else {
      board.className = 'pb c-body';
      providers.forEach(provider);
    }
    const at = snap ? new Date(snap.updatedAt) : null;
    upd.hidden = !at || isNaN(at);
    if (!upd.hidden) updTime.textContent = clock(at);
    tick();
  }

  // re-derive countdowns, the now position, the flat tail and the tooltips from the clock
  function tick() {
    const nowMs = Date.now(), now = new Date(nowMs);
    const passed = [], done = [];
    clocks.forEach(k => {
      const t = Date.parse(k.m.resetsAt);
      if (k.stale && t <= nowMs) { done.push(k); return; }
      const used = num(k.m.usedPercent);
      const lines = [pct(used) + '% used · ' + pct(clamp(100 - used, 0, 100)) + '% left'];
      let over = false;
      if (k.stale) {
        k.leftWord.textContent = 'left as of ' + (isNaN(k.readAt) ? 'an unknown time' : when(new Date(k.readAt), now));
      }
      k.countdown.textContent = '';
      if (isNaN(t)) {
        k.countdown.appendChild(el('span', null, 'reset time unknown'));
        lines.push('Reset time unknown');
      } else if (t <= nowMs) {
        over = true;
        k.countdown.appendChild(el('span', null, 'reset at ' + when(new Date(t), now) + ' · waiting for refresh'));
        lines.push('Reset at ' + when(new Date(t), now));
        if (k.live) passed.push(k.id);
      } else {
        k.countdown.append(el('b', null, span(t - nowMs)), el('span', null, 'to reset'));
        lines.push('Resets ' + when(new Date(t), now));
      }
      k.box.classList.toggle('passed', over);
      lines.push(windowLabel(num(k.m.windowMinutes)));
      const b = over ? null : burn(k, nowMs);
      if (b) {
        const e = String(+(b.elapsed * 100).toFixed(1));
        lines.push((used <= b.elapsed * 100 ? 'Below' : 'Above') + ' even pace: ' + e + '% of the window '
          + (k.stale ? 'had passed at the last read' : 'has passed'));
      }
      k.box.tipLines = lines;
      k.box.setAttribute('aria-label', k.who + ': ' + lines.join('. '));
      drawChart(k, nowMs);
    });
    // finished stale windows turn into ghosts, here rather than in render so one that
    // resets while on screen turns too; the even-pace label moves to the provider's next tile
    if (done.length) {
      clocks = clocks.filter(k => done.indexOf(k) < 0);
      done.forEach(k => {
        if (cur === k.box) hideTip();
        k.box.replaceWith(finishedTile(k));
        const next = k.guide && clocks.find(c => c.p === k.p);
        if (next && !next.guide) { next.guide = true; drawChart(next, nowMs); }
      });
    }
    ghosts.forEach(drawGhost);
    finished.forEach(f => {
      const line = 'window reset at ' + when(new Date(f.t), now) + ' since the last read · waiting for a live read';
      f.text.textContent = line;
      f.box.tipLines = [f.win, line];
      f.box.setAttribute('aria-label', f.label + ': ' + f.box.tipLines.join('. '));
    });
    ages.forEach(a => {
      a.node.textContent = 'last read ' + (isNaN(a.at) ? 'at an unknown time' : span(nowMs - a.at, true) + ' ago')
        + (a.message ? ' · ' + a.message : '');
    });
    if (cur && !tip.hidden && cur.tipLines) fillTip(cur);
    reportStale(passed, nowMs);
  }

  // once per meter per snapshot; one message covers every meter that passed together.
  // the 60 s floor stops a loop if the host answers with the same cached numbers.
  // only live providers report: a stale one waits for the timer, Refresh or a workflow
  function reportStale(ids, nowMs) {
    const stamp = snap ? String(snap.updatedAt) : '';
    const fresh = ids.map(id => stamp + '|' + id).filter(k => !staleSent.has(k));
    if (!fresh.length || nowMs - lastStaleAt < 60000) return;
    fresh.forEach(k => staleSent.add(k));
    lastStaleAt = nowMs;
    Bridge.send({ type: 'stale' });
  }

  function setBusy(on) {
    busy = on;
    refreshBtn.disabled = on;
    document.body.classList.toggle('busy', on);
  }

  // tooltip: hover and keyboard focus show the same text
  let cur = null;
  function fillTip(box) {
    tip.textContent = '';
    box.tipLines.forEach((line, i) => tip.appendChild(el('div', i ? null : 't1', line)));
    tip.hidden = false;
  }
  function placeTip(x, y) {
    const w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    let left = x + 14, top = y + 16;
    if (left + w > vw - 8) left = Math.max(8, x - w - 14);
    if (top + h > vh - 8) top = Math.max(8, y - h - 12);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; cur = null; }
  document.addEventListener('mouseover', e => {
    const box = e.target.closest('.tm');
    if (box === cur) return;
    cur = box;
    if (!box || !box.tipLines) { tip.hidden = true; return; }
    fillTip(box);
    placeTip(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', e => { if (cur) placeTip(e.clientX, e.clientY); });
  document.addEventListener('focusin', e => {
    const box = e.target.closest && e.target.closest('.tm');
    if (!box || !box.tipLines) return;
    const r = box.getBoundingClientRect();
    cur = box;
    fillTip(box);
    placeTip(r.left + Math.min(r.width / 2, 120), r.bottom - 8);
  });
  document.addEventListener('focusout', e => {
    if (e.target.closest && e.target.closest('.tm')) hideTip();
  });
  board.addEventListener('scroll', hideTip, { passive: true });

  // charts follow the tile width; one redraw per frame
  let redrawQueued = false;
  function redraw() {
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(() => {
      redrawQueued = false;
      const nowMs = Date.now();
      clocks.forEach(k => drawChart(k, nowMs));
      ghosts.forEach(drawGhost);
    });
  }
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(board);
  else window.addEventListener('resize', redraw);

  refreshBtn.addEventListener('click', () => { if (!busy) Bridge.send({ type: 'refresh' }); });

  Bridge.on(msg => {
    if (msg.type !== 'snapshot') return;
    if (msg.snapshot && typeof msg.snapshot === 'object') {
      snap = msg.snapshot;
      render();
    }
    setBusy(msg.busy === true);
  });

  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  Bridge.send({ type: 'ready' });
})();
</script>
</body>
</html>
